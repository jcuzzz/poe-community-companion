{% if submission.awards.all %}
  <div class="medal-row">
    {% for award in submission.awards.all %}
      <span class="medal medal-{{ award.award_type }}">{% if award.award_type == "first" %}<span class="medal-crown" aria-hidden="true">&#9819;</span>{% endif %}<span class="medal-dot" aria-hidden="true"></span>{{ award.short_label }} <span class="medal-points">+{{ award.points }}</span></span>
    {% endfor %}
  </div>
{% endif %}
