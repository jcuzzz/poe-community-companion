{% extends "tracker/base.html" %}
{% load static %}
{% block title %}Submissions blocked &middot; {{ brand_name }}{% endblock %}
{% block content %}
  <div class="blocked-overlay">
    <div class="blocked-popup" role="alertdialog" aria-labelledby="blocked-title" aria-describedby="blocked-body">
      <h1 id="blocked-title" class="blocked-title">Submissions blocked</h1>
      <div class="blocked-mark" aria-hidden="true">&#10006;</div>
      <p id="blocked-body" class="blocked-body">
        Your account is currently
        <strong>blocked from submitting</strong>.
      </p>
      <a class="btn btn-primary" href="{% url 'dashboard' %}">Back to the dashboard</a>
    </div>
  </div>
{% endblock %}
