{% if w.ctx.total %}
  <div class="progress-card">
    <div class="progress-ring" style="--p: {{ w.ctx.pct }}%;" role="img"
         aria-label="{{ w.ctx.claimed }} of {{ w.ctx.total }} achievements claimed">
      <span class="progress-ring-value">{{ w.ctx.pct }}%</span>
    </div>
    <div class="progress-legend">
      <p class="progress-legend-title">League progress</p>
      <p class="progress-legend-meta"><strong>{{ w.ctx.claimed }}</strong> of {{ w.ctx.total }} achievements claimed</p>
    </div>
  </div>
{% endif %}
