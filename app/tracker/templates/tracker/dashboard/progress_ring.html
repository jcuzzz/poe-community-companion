{% if w.ctx.achievement_cards %}
  <div class="progress-card">
    <div class="progress-ring" style="--p: {% widthratio w.ctx.firsts|length w.ctx.achievement_cards|length 100 %}%;" role="img"
         aria-label="{{ w.ctx.firsts|length }} of {{ w.ctx.achievement_cards|length }} achievements claimed">
      <span class="progress-ring-value">{% widthratio w.ctx.firsts|length w.ctx.achievement_cards|length 100 %}%</span>
    </div>
    <div class="progress-legend">
      <p class="progress-legend-title">League progress</p>
      <p class="progress-legend-meta"><strong>{{ w.ctx.firsts|length }}</strong> of {{ w.ctx.achievement_cards|length }} achievements claimed</p>
    </div>
  </div>
{% endif %}
