name: poe-community-companion

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: poe-community-companion:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Loopback bind: only the Docker host itself can reach this port, and
      # only your reverse proxy should ever talk to it.
      # NEVER bind 0.0.0.0:8000 — that would expose Django directly.
      #
      # Local-only variant (default below): reachable only from the host
      # itself, e.g. for `curl localhost:8000/healthz` during setup.
      #
      # LAN variant (if your reverse proxy runs on another machine): set
      # APP_BIND=<host-lan-ip> in .env (compose reads it for interpolation).
      - "${APP_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - ./data:/app/data
      - ./media:/app/media
    tmpfs:
      - /tmp
    read_only: false
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # One-shot backup job. Run manually or from the systemd timer in
  # deploy/poe-community-companion-backup.timer:
  #   docker compose run --rm backup
  backup:
    build:
      context: .
      dockerfile: Dockerfile
    image: poe-community-companion:latest
    profiles: ["backup"]
    env_file:
      - .env
    environment:
      # Belt and braces: the backup must land on the mounted volume, not on
      # the container's own filesystem, even if .env forgets BACKUP_DIR.
      BACKUP_DIR: /app/backups
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./backups:/app/backups
    entrypoint: ["python", "manage.py"]
    command: ["backup"]
