name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        working-directory: app
        env:
          DJANGO_DEBUG: "1"
          DJANGO_SECRET_KEY: ci-dummy-secret-key-not-for-production
        run: python manage.py test
